{% extends "base.html" %}
{% block title %}Confirm Split – Receipt Scanner{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4><i class="bi bi-scissors"></i> Confirm YNAB Split</h4>
  <a href="/ui/ynab/match/{{ receipt_id }}" class="btn btn-sm btn-outline-secondary">← Back</a>
</div>

<div class="card shadow-sm">
  <div class="card-header">Split Proposal</div>
  <div class="card-body">
    <div id="splitContent">
      <div class="text-center text-muted py-4">
        <div class="spinner-border"></div>
        <p class="mt-2">Loading split proposal…</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const receiptId = "{{ receipt_id }}";
const params = new URLSearchParams(window.location.search);
const txnId = params.get('txn') || '';

async function loadProposal() {
  if (!txnId) {
    document.getElementById('splitContent').innerHTML = '<div class="alert alert-danger">No transaction ID provided.</div>';
    return;
  }
  const resp = await fetch(`/ynab/split/${receiptId}?ynab_transaction_id=${encodeURIComponent(txnId)}`);
  if (!resp.ok) {
    document.getElementById('splitContent').innerHTML = '<div class="alert alert-warning">Could not load proposal.</div>';
    return;
  }
  const proposal = await resp.json();
  const subs = proposal.proposal_json?.subtransactions || [];

  document.getElementById('splitContent').innerHTML = `
    <p class="text-muted">Transaction: <code>${txnId}</code> &nbsp;|&nbsp; Status: <span class="badge bg-secondary">${proposal.status}</span></p>
    <table class="table table-sm mb-3" id="splitTable">
      <thead class="table-light"><tr><th>Description</th><th>Amount</th><th>Category</th></tr></thead>
      <tbody>
        ${subs.map((s, i) => `
          <tr>
            <td><input class="form-control form-control-sm" value="${s.memo || ''}" id="memo_${i}" /></td>
            <td><input type="number" step="0.01" class="form-control form-control-sm" value="${(Math.abs(s.amount)/1000).toFixed(2)}" id="amount_${i}" style="width:100px" /></td>
            <td><input class="form-control form-control-sm" value="${s.category_id || ''}" id="cat_${i}" placeholder="YNAB category ID" /></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    <div class="d-flex gap-2">
      <button class="btn btn-success" onclick="applySplit(${subs.length})">
        <i class="bi bi-check-circle"></i> Apply Split to YNAB
      </button>
      <a href="/ui/receipts/${receiptId}" class="btn btn-outline-secondary">Cancel</a>
    </div>
    <div id="applyResult" class="mt-3"></div>
  `;
}

async function applySplit(count) {
  const subtransactions = [];
  for (let i = 0; i < count; i++) {
    subtransactions.push({
      amount: -Math.round(parseFloat(document.getElementById(`amount_${i}`).value) * 1000),
      memo: document.getElementById(`memo_${i}`).value || null,
      category_id: document.getElementById(`cat_${i}`).value || null,
    });
  }
  const resp = await fetch(`/ynab/split/${receiptId}/confirm`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ynab_transaction_id: txnId, subtransactions })
  });
  const result = await resp.json();
  document.getElementById('applyResult').innerHTML = resp.ok
    ? `<div class="alert alert-success"><i class="bi bi-check-circle"></i> Split applied successfully!</div>`
    : `<div class="alert alert-danger">Error: ${JSON.stringify(result)}</div>`;
  if (resp.ok) setTimeout(() => window.location.href = `/ui/receipts/${receiptId}`, 1500);
}

loadProposal();
</script>
{% endblock %}
