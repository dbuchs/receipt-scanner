[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-scanner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "boto3>=1.34",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "itsdangerous>=2.2",
    "passlib[bcrypt]>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
